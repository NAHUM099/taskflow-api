name: taskflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      # Mismo puerto que usa application.yaml para desarrollo local. Se publica
      # solo en loopback: PostgreSQL no debe quedar accesible desde la red local.
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - taskflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dentro de la red de Compose el host de PostgreSQL es "postgres".
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-taskflow}
      DB_USERNAME: ${POSTGRES_USER:-taskflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      # Origen real del frontend; en local, el servidor de Next.js.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      PORT: 8080
      FLYWAY_ENABLED: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      LOGIN_RATE_LIMIT_ENABLED: ${LOGIN_RATE_LIMIT_ENABLED:-true}
      LOGIN_RATE_LIMIT_WINDOW: ${LOGIN_RATE_LIMIT_WINDOW:-5m}
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS_PER_ACCOUNT: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS_PER_ACCOUNT:-5}
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS_PER_IP: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS_PER_IP:-30}
      # En local no hay proxy delante: no se confía en X-Forwarded-For.
      LOGIN_RATE_LIMIT_TRUST_FORWARDED_HEADERS: ${LOGIN_RATE_LIMIT_TRUST_FORWARDED_HEADERS:-false}
      LOGIN_RATE_LIMIT_STORE: ${LOGIN_RATE_LIMIT_STORE:-memory}
    ports:
      # Solo loopback por defecto. Si necesitas exponer la API a otro equipo,
      # hazlo de forma consciente y protege el puerto con firewall/TLS.
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  taskflow-postgres-data:
