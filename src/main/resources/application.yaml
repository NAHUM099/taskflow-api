spring:
  application:
    name: taskflow-api

  datasource :
    url: jdbc:postgresql://localhost:5434/taskflow
    username: ${DB_USERNAME}
    password : ${DB_PASSWORD}

  jpa:
    # Las transacciones se delimitan en los servicios. Sin OSIV, una relación
    # LAZY no puede inicializarse fuera de la transacción ni desde la capa web.
    open-in-view: false
    hibernate:
      # Hibernate solo comprueba que el esquema coincide con las entidades:
      # nunca crea ni modifica tablas. El esquema lo administra Flyway.
      ddl-auto: validate

  jackson:
    serialization:
      # LocalDateTime se serializa como ISO-8601 (sin offset) hasta que se
      # pueda verificar la zona horaria de los datos existentes.
      write-dates-as-timestamps: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # Adopción de una base de datos EXISTENTE: se activa una única vez de forma
    # manual (ver README, "Bases de datos existentes"). Por defecto queda
    # desactivado para que ninguna base se marque como inicializada sin querer.
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    baseline-description: esquema previo a Flyway

  # Solo se usa cuando taskflow.security.login-rate-limit.store=redis.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

taskflow:
  cors:
    # Orígenes permitidos, separados por comas. No se admiten comodines.
    # En Render debe definirse CORS_ALLOWED_ORIGINS con el origen real del
    # frontend; este valor por defecto es solo para desarrollo local.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  security:
    # Rate limiting del endpoint /auth/login.
    login-rate-limit:
      enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      window: ${LOGIN_RATE_LIMIT_WINDOW:5m}
      max-attempts-per-account: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS_PER_ACCOUNT:5}
      max-attempts-per-ip: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS_PER_IP:30}
      # Activar solo si hay un proxy de confianza delante (Railway, Render, nginx...).
      trust-forwarded-headers: ${LOGIN_RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
      # Obligatorio si trust-forwarded-headers=true: IPs/CIDR separados por comas.
      # El arranque falla si está vacío. Se rechazan rangos IPv4 con prefijo
      # menor que /16 e IPv6 menor que /32 para no confiar en redes de clientes.
      trusted-proxies: ${LOGIN_RATE_LIMIT_TRUSTED_PROXIES:}
      # memory = estado por instancia; redis = estado compartido entre réplicas.
      store: ${LOGIN_RATE_LIMIT_STORE:memory}

server:
  port: ${PORT:8080}